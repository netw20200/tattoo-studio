<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Test</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="parallax-section">
    <div class="content">
      <div class="number">01</div>
      <h1>PARALLAX</h1>
    </div>

    <div
      class="parallax"
      data-parallax-image="images/hero.jpg">
    </div>
  </section>
<section class="parallax-section second-parallax">
  <div
    class="parallax"
    data-parallax-image="images/tattoo-process.jpg">
  </div>
</section>

  <section class="space">
    <h2>SCROLL</h2>
  </section>


  <script src="https://unpkg.com/universal-parallax@1.3.2/dist/universal-parallax.min.js"></script>

  <script>
    new universalParallax().init({
      speed: 4
    });
  </script>

</body>
</html>
